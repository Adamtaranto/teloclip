name: Python Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      # Checkout the latest commit associated with the PR
      - uses: actions/checkout@v7
      - name: Debug matrix value
        run: echo "Python version is ${{ matrix.python-version }}"
      # Set up Miniconda
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true # Optional: update Conda to the latest version
          python-version: ${{ matrix.python-version }}
          conda-remove-defaults: true
          channels: conda-forge, bioconda
      # Install any additional dependencies not included in the pyproject.toml file
      - name: Install additional dependencies
        run: |
          conda install -y -c conda-forge -c bioconda minimap2 samtools pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --retries 10 --timeout 180 --prefer-binary --progress-bar off --no-cache-dir '.[test]'
        shell: bash -l {0}
      # Verify pip installation
      - name: Verify Python/pip
        run: |
          python --version
          python -m pip --version
        shell: bash -l {0}
      # Verify pytest installation
      - name: Verify pytest installation
        run: python -m pytest --version
        shell: bash -l {0}
      # Run pytest. Coverage is switched off explicitly on every version except the one we report from.
      - name: Test with pytest
        if: matrix.python-version != '3.14'
        run: |
          pytest -v --no-cov
        shell: bash -l {0}
      - name: Test with pytest and coverage
        if: matrix.python-version == '3.14'
        run: |
          pytest -v --cov=teloclip --cov-branch --cov-report=xml
        shell: bash -l {0}
      # Upload coverage report to Codecov
      # Only upload coverage for the latest Python version
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Adamtaranto/teloclip
