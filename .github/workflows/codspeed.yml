name: CodSpeed Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "src/teloclip/**"
      - ".github/workflows/codspeed.yml"
  # Allow running on demand from the Actions tab.
  workflow_dispatch:
concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[bench]'
      # Verify the benchmarks still run even when CodSpeed is not configured,
      # so a broken benchmark is caught rather than silently skipped along with
      # the upload.
      - name: Check benchmarks execute
        run: pytest benchmarks -p no:cacheprovider -q -o addopts=""
      - name: Report CodSpeed token status
        id: codspeed
        env:
          TOKEN: ${{ secrets.CODSPEED_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CODSPEED_TOKEN is not set; skipping the upload to \
            codspeed.io. Benchmarks were still executed above. Add the secret \
            to enable performance tracking."
          fi
      - name: Run benchmarks
        if: steps.codspeed.outputs.configured == 'true'
        uses: CodSpeedHQ/action@v5
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          # Simulation mode: deterministic CPU measurement, which suits this
          # CPU-bound parsing and regex work far better than walltime on a
          # shared runner.
          mode: simulation
          # Coverage instrumentation would distort the measurements, so the
          # addopts from pyproject.toml are overridden here.
          run: pytest benchmarks --codspeed -p no:cacheprovider -o addopts=""
