name: CodSpeed Benchmarks
on:
  push:
    branches: [main]
  pull_request:
  # Allow running on demand from the Actions tab.
  workflow_dispatch:
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          # Coverage instrumentation would distort the measurements, so the
          # addopts from pyproject.toml are overridden here.
          run: pytest benchmarks --codspeed -p no:cacheprovider --no-cov
